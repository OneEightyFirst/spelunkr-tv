# Builds the APK from this repo's source on GitHub's servers, so every published APK
# can be traced to the exact commit it was built from.
#   - Every push / PR: build check only.
#   - Pushing a tag like v1.0.0: build, sign, publish a GitHub Release, and update the
#     download page at https://oneeightyfirst.github.io/spelunkr-tv/
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build (unsigned)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: ./gradlew --no-daemon assembleRelease

      - name: Build and sign release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          SIGNING_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease
          rm "$RUNNER_TEMP/release.jks"
          mkdir -p site
          cp app/build/outputs/apk/release/app-release.apk site/spelunkr-tv.apk
          (cd site && sha256sum spelunkr-tv.apk > spelunkr-tv.apk.sha256)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs site/spelunkr-tv.apk | head -3

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" site/spelunkr-tv.apk site/spelunkr-tv.apk.sha256 \
            --title "$GITHUB_REF_NAME" --notes "Built by GitHub Actions from commit $GITHUB_SHA. SHA-256: $(cut -d' ' -f1 site/spelunkr-tv.apk.sha256)"

      - name: Prepare download page
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SHA=$(cut -d' ' -f1 site/spelunkr-tv.apk.sha256)
          sed -e "s/{{VERSION}}/$GITHUB_REF_NAME/g" -e "s/{{SHA256}}/$SHA/g" -e "s/{{COMMIT}}/$GITHUB_SHA/g" docs/index.html > site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: site

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
